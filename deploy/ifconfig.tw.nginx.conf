 #   } # managed by Certbot

    add_header X-Server-Conf ifconfig.tw;
    server_name ifconfig.tw;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ifconfig.tw/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ifconfig.tw/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    access_log /var/log/nginx/ifconfig.tw.access.log;
    error_log /var/log/nginx/ifconfig.tw.error.log;

    location ^~ /.well-known/acme-challenge/ {
	    root /var/www/ifconfig.tw/;
    }
    location / {
            proxy_pass http://127.0.0.1:1980;
	    proxy_set_header X-Tih-Forwarded-For $remote_addr;
	    proxy_set_header X-Tih-Forwarded-For-Port $remote_port;
                proxy_set_header Keep-Alive $http_keep_alive;

    }
    index index.html index.htm;
}

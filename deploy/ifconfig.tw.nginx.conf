# IPv6-only query endpoint. The IPv4 guard also supports ACME validation
# while old A records remain cached.
server {
    listen 80;
    server_name v6.ifconfig.tw;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ifconfig.tw/;
    }
    location / {
        default_type text/plain;
        return 421 "This endpoint requires IPv6. Use curl -6 https://v6.ifconfig.tw/ip or use https://v4.ifconfig.tw/ip for IPv4.\n";
    }
}

# IPv4-only DNS entry; prefer HTTPS for command-line queries.
server {
    listen 80;
    server_name v4.ifconfig.tw;

    location = /ads.txt {
        alias /opt/ifconfig.tw/static/ads.txt;
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /privacy {
        alias /opt/ifconfig.tw/static/privacy.html;
        default_type text/html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
    }
    access_log /var/log/nginx/ifconfig.tw.access.log;
    error_log /var/log/nginx/ifconfig.tw.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ifconfig.tw/;
    }

    location / {
        proxy_pass http://127.0.0.1:1980;
        proxy_set_header X-Tih-Forwarded-For $remote_addr;
        proxy_set_header X-Tih-Forwarded-For-Port $remote_port;
        proxy_set_header Keep-Alive $http_keep_alive;
    }
}

